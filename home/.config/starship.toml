# =========================
# Starship (focused version)
# 主役: C/C++, Python
# 方針: プロンプトのたびに外部コマンドが走らないよう、言語バージョンは表示しない
# =========================
add_newline = true
command_timeout = 500
scan_timeout = 10

# 1行目: OS / ユーザ@ホスト(SSH時) / ディレクトリ / Git / 言語 / シェル / 実行時間 / ステータス
# 2行目: 入力記号
format = """
$os$username$hostname$directory$git_branch$git_status$c$python$shell$cmd_duration$status
$character"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[directory]
truncation_length = 2
truncate_to_repo = true
style = "cyan"
format = "[$path]($style) "
read_only = " "

# ---- Git ----
[git_branch]
symbol = " "         # Nerd Font (なくても文字化けするだけで動作はOK)
format = "[$symbol$branch]($style) "
style = "purple"

[git_status]
style  = "yellow"
format = '([$all_status$ahead_behind]($style)) '
conflicted = " "
staged     = "+"
modified   = "!"
deleted    = "✘${count} "
untracked  = "?"
stashed    = " "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕${ahead_count}/${behind_count}"

# ---- 言語（条件を満たすときだけ表示。バージョンは出さない） ----
[c]
symbol = " "         # Nerd Font (なくてもOK)
format = "[$symbol]($style) "
style = "bright-blue"
detect_extensions = ["c", "h", "cpp", "cxx", "cc", "hpp", "hh", "ipp"]
detect_files = ["CMakeLists.txt", "Makefile"]

# Python（venv 名のみ）
[python]
symbol = "🐍 "
format = "[$symbol($virtualenv)]($style) "
style = "blue"
detect_files = ["pyproject.toml", "requirements.txt", "setup.py"]

# 現在のシェルを薄く表示
[shell]
disabled = false
bash_indicator = "bash"
zsh_indicator = "zsh"
powershell_indicator = "pwsh"
unknown_indicator = "sh"
format = "[$indicator]($style) "
style = "dimmed"

# ---- 遅い時だけ実行時間を表示 ----
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "dimmed italic white"

# ---- ステータス（失敗時だけ） ----
[status]
disabled = false
recognize_signal_code = true
format = "[$symbol$status]($style) "
map_symbol = true
style = "bold red"
pipestatus = false

[os]
disabled = false
format = "[$symbol]($style)"
style = "dimmed"
[os.symbols]
Ubuntu = "󰕈 "
Linux  = ""
Windows = ""

[hostname]
ssh_only = true
format = "[@$hostname](dimmed purple) "

[username]
show_always = false
style_user = "bold white"
style_root = "bold red"
format = "[$user]($style)"
